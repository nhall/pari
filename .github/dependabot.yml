version: 2

updates:
  # npm dependencies in package.json. Groups minor/patch into one PR to reduce noise.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Playwright must move together with the container image tags in ci.yml and release.yml,
      # or CI fails. Its own PR keeps that failure from blocking the other updates.
      playwright:
        patterns:
          - playwright
      minor-and-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - playwright

  # GitHub Actions versions in workflow files.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
